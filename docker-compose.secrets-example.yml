version: '3.8'

services:
  app:
    image: ghcr.io/tylermiranda/optistack:latest
    container_name: optistack
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - TZ=${TZ:-Canada/Eastern}
      - PORT=${PORT:-3000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - AI_PROVIDER=${AI_PROVIDER}
      - OLLAMA_URL=${OLLAMA_URL}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      
      # Using Docker Secrets - specify _FILE suffix to use secret files
      - ADMIN_USERNAME_FILE=/run/secrets/optistack_admin_username
      - ADMIN_PASSWORD_FILE=/run/secrets/optistack_admin_password
      - OIDC_CLIENT_ID_FILE=/run/secrets/optistack_client_id
      - OIDC_CLIENT_SECRET_FILE=/run/secrets/optistack_client_secret
      
      # OIDC Configuration
      - OIDC_ISSUER=${OIDC_ISSUER}
      - OIDC_AUTH_URL=${OIDC_AUTH_URL}
      - OIDC_TOKEN_URL=${OIDC_TOKEN_URL}
      - OIDC_USERINFO_URL=${OIDC_USERINFO_URL}
      - OIDC_CALLBACK_URL=${OIDC_CALLBACK_URL}
      
    volumes:
      - optistack-data:/app/data
    secrets:
      - optistack_admin_username
      - optistack_admin_password
      - optistack_client_id
      - optistack_client_secret
    networks:
      - optistack
    restart: unless-stopped

secrets:
  optistack_admin_username:
    file: ./secrets/optistack_admin_username.txt
  optistack_admin_password:
    file: ./secrets/optistack_admin_password.txt
  optistack_client_id:
    file: ./secrets/optistack_client_id.txt
  optistack_client_secret:
    file: ./secrets/optistack_client_secret.txt

volumes:
  optistack-data:

networks:
  optistack:
